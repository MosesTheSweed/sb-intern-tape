<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Intern Tape · Stonk Interns</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
  <style>
    :root {
      --bg: #070806; --surface: #12150f; --raised: #1a1f16;
      --fg: #e7eadc; --muted: #8b9178; --lime: #c6f000;
      --ink: #0b0d08; --line: #2a3124; --warn: #ff6a3d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    a { color: inherit; }
    button { cursor: pointer; font-family: inherit; }
    header, .note, main, footer { max-width: 72rem; margin: 0 auto; padding: 0 1.25rem; }
    header { display: flex; flex-wrap: wrap; gap: .75rem; align-items: end;
      justify-content: space-between; padding-top: 1rem; padding-bottom: .75rem; }
    .kicker { font-family: "IBM Plex Mono", monospace; font-size: 11px;
      letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
    h1 { margin: 0; font-size: 1.35rem; }
    .meta { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--muted); }
    .note { padding: .6rem 1.25rem; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
      background: var(--raised); font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--muted); }
    main { display: grid; gap: 1rem; padding: 1.1rem 1.25rem 1.5rem; }
    @media (min-width: 960px) {
      main { grid-template-columns: 1.2fr .9fr; align-items: start; }
      aside.card {
        position: sticky; top: 12px;
        max-height: calc(100dvh - 24px); overflow: auto;
      }
    }
    .tools { display: flex; flex-direction: column; gap: .5rem; margin-bottom: .75rem; }
    @media (min-width: 640px) { .tools { flex-direction: row; } }
    input[type="search"] {
      flex: 1; height: 44px; border: 1px solid var(--line); background: var(--surface);
      color: var(--fg); padding: 0 .9rem; font-family: "IBM Plex Mono", monospace; font-size: 13px; border-radius: 6px;
    }
    .filters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    @media (min-width: 800px) { .filters { grid-template-columns: repeat(8, 1fr); } }
    .filters button, .connect {
      height: 44px; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
      font-family: "IBM Plex Mono", monospace; font-size: 11px; border-radius: 6px;
    }
    .filters button.on, .connect.on { background: var(--lime); color: var(--ink); border-color: var(--lime); }
    th button { all: unset; cursor: pointer; color: inherit; }
    th button:hover { color: var(--lime); }
    .tablewrap { overflow-x: auto; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; font-family: "IBM Plex Mono", monospace; font-size: 13px; }
    th { text-align: left; color: var(--muted); font-weight: 500; font-size: 11px; padding: .5rem .75rem; border-bottom: 1px solid var(--line); }
    td { padding: .65rem .75rem; border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
    tr.row { cursor: pointer; }
    tr.row:hover { background: var(--raised); }
    tr.row.sel { background: color-mix(in srgb, var(--lime) 12%, transparent); }
    .share { color: var(--lime); }
    .muted { color: var(--muted); }
    .foot { padding: .5rem .75rem; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); }
    .card { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 1rem; }
    .card-head { display: flex; justify-content: space-between; gap: .75rem; align-items: flex-start; }
    h2 { margin: .1rem 0; font-size: 1.6rem; }
    .os, .connect {
      display: inline-flex; align-items: center; height: 44px; padding: 0 .9rem;
      text-decoration: none; font-family: "IBM Plex Mono", monospace; font-size: 12px; border-radius: 6px;
    }
    .os { background: var(--lime); color: var(--ink); }
    .os.dim { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    .warn { margin-top: .75rem; border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent);
      background: color-mix(in srgb, var(--warn) 10%, transparent); color: var(--warn); padding: .55rem .7rem; font-size: 13px; border-radius: 6px; }
    .info { margin-top: .75rem; border: 1px solid var(--line); padding: .55rem .7rem; font-size: 12px; color: var(--muted);
      font-family: "IBM Plex Mono", monospace; border-radius: 6px; }
    dl { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; margin: 1rem 0 0; }
    dt { font-size: 11px; color: var(--muted); font-family: "IBM Plex Mono", monospace; }
    dd { margin: .15rem 0 0; font-family: "IBM Plex Mono", monospace; font-size: 14px; }
    dd.hot { color: var(--lime); }
    .sib { margin-top: 1rem; padding-top: .75rem; border-top: 1px solid var(--line);
      font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); }
    footer { padding: 1rem 1.25rem 2rem; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); }
    footer button { margin-left: .5rem; height: 36px; padding: 0 .7rem; border: 1px solid var(--line);
      background: var(--surface); color: var(--fg); border-radius: 6px; font-family: inherit; font-size: 11px; }
    .head-actions { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header>
    <div>
      <p class="kicker">intern tape · robinhood chain</p>
      <h1>Stonk Interns research</h1>
    </div>
    <div class="head-actions">
      <p class="meta" id="snapMeta">loading snapshot…</p>
      <button type="button" class="connect" id="connectBtn">Connect</button>
    </div>
  </header>
  <p class="note">Read-only. OpenSea is the buy button. Snapshot is pushed from holmes, not a live RPC from your browser.</p>
  <main>
    <section>
      <div class="tools">
        <input id="q" type="search" placeholder="Intern #, broker #, title" />
        <div class="filters" id="filters"></div>
      </div>
      <div class="tablewrap">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="foot" id="foot"></div>
      </div>
    </section>
    <aside class="card" id="dossier">Select an intern.</aside>
  </main>
  <footer>
    Tip jar — ETH or $STONKBROKER on Robinhood Chain<br />
    <span id="tipAddr">0x89DebA722c82cb078e9ca765338F01dbB1890C76</span>
    <button type="button" id="copyTip">Copy</button>
  </footer>
  <script>
    const TIP = "0x89DebA722c82cb078e9ca765338F01dbB1890C76";
    const ALLOW = ["0x89deba722c82cb078e9ca765338f01dbb1890c76"];
    const MAX_ROWS = 400;
    const ACT_RANK = { Alumnus: 5, Senior: 4, Junior: 3, Sophomore: 2, Freshman: 1 };
    const PUBLIC_FILTERS = [
      ["all", "All"], ["paying", "% > 0"], ["employed", "Live"], ["dormant", "Dormant"],
      ["listed", "Listed"],
    ];
    const EDGE_FILTERS = [
      ["head", "Head 2.5"], ["coupon", "Coupon"],
    ];
    const PUBLIC_SORTS = [
      ["best", "Best"], ["share", "Share"], ["ask", "Ask"], ["id", "#"], ["status", "Status"],
    ];
    const EDGE_SORTS = [["desk", "Desk"]];

    let dump = null, filter = "all", sort = "best", sel = 3474, q = "";
    let account = null, byParent = {};

    function desk() {
      return !!(account && ALLOW.includes(account));
    }
    function dormant(s) { return (s || "").toLowerCase().includes("dormant"); }
    function parentOn(s) { return (s || "").toLowerCase() === "active"; }
    function shortAddr(a) {
      if (!a || a.length < 12) return a || "—";
      return a.slice(0, 6) + "…" + a.slice(-4);
    }
    function combined(i) {
      return (byParent[i.parent] || []).reduce((s, x) => s + (x.sharePct || 0), 0);
    }
    function deskScore(i) {
      if (dormant(i.status) || !parentOn(i.parentStatus)) return 0;
      return +(i.sharePct * (1 + (ACT_RANK[i.activation] || 0) * 0.15)).toFixed(3);
    }
    function cmpBest(a, b) {
      const live = Number(!dormant(b.status)) - Number(!dormant(a.status));
      if (live) return live;
      const par = Number(parentOn(b.parentStatus)) - Number(parentOn(a.parentStatus));
      if (par) return par;
      if (b.sharePct !== a.sharePct) return b.sharePct - a.sharePct;
      const act = (ACT_RANK[b.activation] || 0) - (ACT_RANK[a.activation] || 0);
      if (act) return act;
      return a.id - b.id;
    }
    function rows() {
      const needle = q.trim().toLowerCase();
      const list = dump.interns.filter((i) => {
        const live = !dormant(i.status);
        const on = parentOn(i.parentStatus);
        if (filter === "paying" && i.sharePct <= 0) return false;
        if (filter === "dormant" && live) return false;
        if (filter === "employed" && !live) return false;
        if (filter === "head" && !(live && on && i.sharePct >= 2.5)) return false;
        if (filter === "coupon" && !(live && on && i.sharePct >= 0.5)) return false;
        if (filter === "listed" && !i.listed) return false;
        if (!needle) return true;
        return String(i.id).includes(needle) || String(i.parent).includes(needle)
          || (i.title || "").toLowerCase().includes(needle)
          || (i.class || "").toLowerCase().includes(needle);
      });
      if (sort === "best") list.sort(cmpBest);
      else if (sort === "share") list.sort((a, b) => b.sharePct - a.sharePct || a.id - b.id);
      else if (sort === "ask") list.sort((a, b) => (a.askEth == null) - (b.askEth == null) || (a.askEth || 0) - (b.askEth || 0) || a.id - b.id);
      else if (sort === "status") list.sort((a, b) => Number(dormant(a.status)) - Number(dormant(b.status)) || a.id - b.id);
      else if (sort === "desk") list.sort((a, b) => deskScore(b) - deskScore(a) || a.id - b.id);
      else list.sort((a, b) => a.id - b.id);
      return list;
    }
    function renderFilters() {
      const extraF = desk() ? EDGE_FILTERS : [];
      const extraS = desk() ? EDGE_SORTS : [];
      document.getElementById("filters").innerHTML =
        PUBLIC_FILTERS.concat(extraF).map(([k, lab]) =>
          `<button type="button" data-f="${k}" class="${filter === k ? "on" : ""}">${lab}</button>`
        ).join("") +
        PUBLIC_SORTS.concat(extraS).map(([k, lab]) =>
          `<button type="button" data-s="${k}" class="${sort === k ? "on" : ""}">${lab}</button>`
        ).join("");
    }
    function renderHead() {
      const extra = desk() ? `<th><button type="button" data-s="desk">Desk</button></th><th>Cap</th>` : "";
      document.getElementById("thead").innerHTML = `<tr>
        <th><button type="button" data-s="id">Intern</button></th>
        <th>Parent</th>
        <th><button type="button" data-s="share">Share</button></th>
        <th><button type="button" data-s="ask">Ask</button></th>
        <th>Title</th>
        <th><button type="button" data-s="status">Status</button></th>
        ${extra}
      </tr>`;
    }
    function renderTable() {
      const list = rows();
      const view = list.slice(0, MAX_ROWS);
      const showDesk = desk();
      document.getElementById("tbody").innerHTML = view.map((i) => `
        <tr class="row ${sel === i.id ? "sel" : ""}" data-id="${i.id}">
          <td>#${i.id} <span class="muted">${i.class || ""} ${i.version || ""}</span></td>
          <td>#${i.parent}</td>
          <td class="share">${i.share}</td>
          <td class="${i.listed ? "share" : "muted"}">${i.askEth == null ? "—" : i.askEth.toFixed(3)}${i.vsFloor ? " ×" + i.vsFloor.toFixed(2) : ""}</td>
          <td class="muted">${i.title || ""}</td>
          <td class="muted">${i.status || ""}</td>
          ${showDesk ? `<td class="share">${deskScore(i)}</td><td class="muted">${combined(i).toFixed(2)}%</td>` : ""}
        </tr>`).join("");
      document.getElementById("foot").textContent =
        `Showing ${view.length} of ${list.length} matches · ${dump.sampled}/${dump.total} in snapshot`;
    }
    function renderDossier() {
      const list = rows();
      const row = dump.interns.find((i) => i.id === sel) || list[0];
      const el = document.getElementById("dossier");
      if (!row) { el.textContent = "Select an intern."; return; }
      const sibs = (byParent[row.parent] || []).filter((x) => x.id !== row.id);
      const sib = sibs[0];
      const live = !dormant(row.status);
      const furlough = !parentOn(row.parentStatus);
      const cap = combined(row);
      el.innerHTML = `
        <div class="card-head">
          <div>
            <p class="kicker">Dossier</p>
            <h2>Intern #${row.id}</h2>
            <p class="muted">${row.class} ${row.version} · parent broker #${row.parent}</p>
          </div>
          <a class="os ${live ? "" : "dim"}" href="${row.opensea}" target="_blank" rel="noreferrer">OpenSea</a>
        </div>
        ${furlough ? `<p class="warn">Parent not Active — intern slice is furloughed.</p>` : ""}
        ${!live ? `<p class="info">Dormant in parent TBA. No listing until the broker mints it out.</p>` : ""}
        <dl>
          <div><dt>Pay share</dt><dd class="hot">${row.share}</dd></div>
          <div><dt>Ask</dt><dd class="hot">${row.askEth == null ? "unlisted" : row.askEth.toFixed(4) + " ETH"}</dd></div>
          <div><dt>vs floor</dt><dd>${row.vsFloor == null ? "—" : row.vsFloor.toFixed(2) + "×  (floor " + (dump.floorEth || "—") + ")"}</dd></div>
          <div><dt>Best bid</dt><dd>${row.offerEth == null ? "—" : row.offerEth.toFixed(4) + " ETH"}</dd></div>
          <div><dt>Job title</dt><dd>${row.title || "—"}</dd></div>
          <div><dt>Activation</dt><dd>${row.activation || "—"}</dd></div>
          <div><dt>Intern status</dt><dd>${row.status || "—"}</dd></div>
          <div><dt>Parent status</dt><dd>${row.parentStatus || "—"}</dd></div>
          <div><dt>Parent tier</dt><dd>${row.parentTier || "—"}</dd></div>
          <div><dt>Intern TBA</dt><dd>${shortAddr(row.wallet)}</dd></div>
          <div><dt>Owner</dt><dd>${shortAddr(row.owner)}</dd></div>
          ${desk() ? `<div><dt>Desk score</dt><dd class="hot">${deskScore(row)}</dd></div>
            <div><dt>Broker cap used</dt><dd>${cap.toFixed(2)}% / 5%</dd></div>` : ""}
        </dl>
        <p class="sib">${sib
          ? `Other intern on broker #${row.parent}: #${sib.id} · ${sib.share} · ${sib.title} · ${cap.toFixed(2)}% combined (cap 5%).`
          : "Sibling intern not in this snapshot."}</p>`;
    }
    function renderConnect() {
      const b = document.getElementById("connectBtn");
      if (desk()) {
        b.textContent = "Desk " + shortAddr(account);
        b.classList.add("on");
      } else if (account) {
        b.textContent = shortAddr(account);
        b.classList.remove("on");
      } else {
        b.textContent = "Connect";
        b.classList.remove("on");
      }
    }
    function render() {
      if (!dump) return;
      if (!desk() && (filter === "head" || filter === "coupon")) filter = "employed";
      if (!desk() && sort === "desk") sort = "best";
      renderConnect();
      renderFilters();
      renderHead();
      renderTable();
      renderDossier();
    }

    document.getElementById("filters").addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.f) {
        filter = b.dataset.f;
        if (filter === "listed") sort = "ask";
        if (filter === "head" || filter === "coupon") sort = "ask";
      }
      if (b.dataset.s) sort = b.dataset.s;
      render();
    });
    document.getElementById("thead").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-s]");
      if (!b) return;
      sort = b.dataset.s;
      render();
    });
    document.getElementById("tbody").addEventListener("click", (e) => {
      const tr = e.target.closest("tr[data-id]");
      if (!tr) return;
      sel = Number(tr.dataset.id);
      render();
    });
    document.getElementById("q").addEventListener("input", (e) => {
      q = e.target.value;
      render();
    });
    document.getElementById("connectBtn").addEventListener("click", async () => {
      if (!window.ethereum) {
        alert("No injected wallet. Use MetaMask / Rabby on this page.");
        return;
      }
      const accs = await window.ethereum.request({ method: "eth_requestAccounts" });
      account = (accs[0] || "").toLowerCase();
      if (desk()) sort = "desk";
      render();
    });
    document.getElementById("copyTip").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(TIP);
        document.getElementById("copyTip").textContent = "Copied";
        setTimeout(() => { document.getElementById("copyTip").textContent = "Copy"; }, 1200);
      } catch (e) {}
    });

    fetch("interns.json")
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then((d) => {
        dump = d;
        byParent = {};
        for (const i of d.interns) {
          (byParent[i.parent] || (byParent[i.parent] = [])).push(i);
        }
        document.getElementById("snapMeta").textContent =
          `${d.sampled} / ${d.total} · floor ${d.floorEth ?? "—"} ETH · listed ${d.listedCount ?? "—"} · ${d.osUpdatedAt || d.updatedAt || ""}`;
        if (!d.interns.some((i) => i.id === 3474) && d.interns[0]) sel = d.interns[0].id;
        render();
      })
      .catch((e) => {
        document.getElementById("snapMeta").textContent = "failed to load interns.json";
        document.getElementById("dossier").textContent = String(e);
      });
  </script>
</body>
</html>
